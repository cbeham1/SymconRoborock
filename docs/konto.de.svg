<svg xmlns="http://www.w3.org/2000/svg" width="760" height="546" viewBox="0 0 760 546"><rect x="0.5" y="0.5" width="759" height="545" rx="10" fill="#ffffff" stroke="#d0d7de"/><path d="M0.5 10.5 a10 10 0 0 1 10 -10 h739 a10 10 0 0 1 10 10 v40 h-759 z" fill="#24323d"/><text x="20" y="28" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="start">Roborock Cloud Account</text><text x="740" y="28" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#9fb3c2" font-weight="normal" text-anchor="end">Roborock Cloud Account</text><text x="40" y="74" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#59636e" font-weight="normal" text-anchor="start">Zugangsdaten der Roborock-App. Das Passwort ist optional: ohne Passwort mit einem per E-Mail</text><text x="40" y="92" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#59636e" font-weight="normal" text-anchor="start">gesendeten Code anmelden (die Anmeldung muss dann wiederholt werden, wenn Roborock sie beendet).</text><circle cx="24" cy="116" r="11" fill="#e8590c"/><text x="24" y="120" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">1</text><text x="40" y="114" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#59636e" font-weight="normal" text-anchor="start">E-Mail-Adresse</text><rect x="40" y="120" width="680" height="28" rx="4" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/><text x="50" y="139" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start">name@example.com</text><text x="40" y="170" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#59636e" font-weight="normal" text-anchor="start">Passwort (optional)</text><rect x="40" y="176" width="680" height="28" rx="4" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/><text x="50" y="195" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#59636e" font-weight="normal" text-anchor="start"></text><rect x="40" y="214" width="199" height="30" rx="4" fill="#ffffff" stroke="#00897b" stroke-width="1.2"/><text x="140" y="234" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#00897b" font-weight="bold" text-anchor="middle">MIT PASSWORT ANMELDEN</text><circle cx="24" cy="270" r="11" fill="#e8590c"/><text x="24" y="274" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">2</text><rect x="40" y="256" width="208" height="30" rx="4" fill="#00897b" stroke="#00897b" stroke-width="1.2"/><text x="144" y="276" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">CODE PER E-MAIL SENDEN</text><circle cx="24" cy="312" r="11" fill="#e8590c"/><text x="24" y="316" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">3</text><text x="40" y="310" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#59636e" font-weight="normal" text-anchor="start">Code aus der E-Mail</text><rect x="40" y="316" width="260" height="28" rx="4" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/><text x="50" y="335" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start">123456</text><rect x="40" y="354" width="167" height="30" rx="4" fill="#00897b" stroke="#00897b" stroke-width="1.2"/><text x="123" y="374" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">MIT CODE ANMELDEN</text><rect x="217" y="354" width="93" height="30" rx="4" fill="#ffffff" stroke="#00897b" stroke-width="1.2"/><text x="263" y="374" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#00897b" font-weight="bold" text-anchor="middle">ABMELDEN</text><circle cx="47" cy="407" r="6" fill="#1a7f37"/><text x="60" y="412" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1a7f37" font-weight="bold" text-anchor="start">Aktiv – angemeldet</text><line x1="20" y1="430" x2="740" y2="430" stroke="#d0d7de"/><circle cx="30" cy="450" r="11" fill="#e8590c"/><text x="30" y="454" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">1</text><text x="50" y="455" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2328" font-weight="normal" text-anchor="start">E-Mail-Adresse des Roborock-Kontos (wie in der Roborock-App), dann Übernehmen.</text><circle cx="30" cy="475" r="11" fill="#e8590c"/><text x="30" y="480" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">2</text><text x="50" y="480" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2328" font-weight="normal" text-anchor="start">Roborock schickt einen 6-stelligen Code an diese Adresse (Spam-Ordner prüfen).</text><circle cx="30" cy="500" r="11" fill="#e8590c"/><text x="30" y="504" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">3</text><text x="50" y="505" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2328" font-weight="normal" text-anchor="start">Code einfügen und „Mit Code anmelden“. Alternativ Passwort eintragen und „Mit Passwort anmelden“ –</text><text x="50" y="522" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2328" font-weight="normal" text-anchor="start">dann meldet sich das Modul selbst neu an.</text></svg>
