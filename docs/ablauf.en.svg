ke="#d0d7de" stroke-width="1.2"/><text x="244" y="542" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start">Choose rooms, consumables, statistics and status tile in the robot</text><text x="244" y="560" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start">instance</text><circle cx="38" cy="545" r="11" fill="#e8590c"/><text x="38" y="550" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">8</text></svg>
